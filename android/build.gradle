allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Plugin modules read flutter.compileSdkVersion before the app applies the Flutter plugin.
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: 36,
            minSdkVersion    : 23,
            targetSdkVersion : 35,
            ndkVersion       : "27.0.12077973",
        ]
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
