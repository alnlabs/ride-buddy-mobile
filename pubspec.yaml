name: ridebuddy
description: Ride Buddy — employee carpool, jobs, meetups
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.10.0
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^7.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  share_plus: ^12.0.2
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  google_fonts: ^8.0.0
  android_intent_plus: ^6.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logos/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logos/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logos/
